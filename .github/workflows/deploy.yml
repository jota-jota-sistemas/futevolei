name: Deploy no GitHub Pages

on:
  # Publica a cada push na main.
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Actions.
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes; mantém só o mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build com Astro
        uses: withastro/action@v3
        with:
          # Astro 7 exige Node >= 22.23.4. O runner usa Node 20 por padrão,
          # o que quebra o build; por isso fixamos uma versão compatível.
          node-version: 22
        # A action instala deps, roda `astro build` e sobe o artefato de dist/.
        # O `base` e o `site` vêm do astro.config.mjs.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
