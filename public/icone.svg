<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon da marca PINGO FTV — identidade turquesa.
  Paleta: turquesa #00B8A9 (destaque) sobre azul-marinho #102A43 (fundo).
  Fonte de verdade do favicon: este SVG é rasterizado para public/icone.png
  (ver scripts/gerar-favicon.mjs). Edite aqui e regenere o PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Pingo FTV">
  <!-- Fundo arredondado azul-marinho -->
  <rect width="256" height="256" rx="56" fill="#102A43"/>

  <!-- Monograma "P" turquesa -->
  <path
    d="M86 56 H150 C181 56 202 77 202 108 C202 139 181 160 150 160 H120 V200 H86 Z M120 96 V120 H146 C154 120 160 114 160 108 C160 102 154 96 146 96 Z"
    fill="#00B8A9"/>

  <!-- Bola de futevôlei estilizada (acento) -->
  <g>
    <circle cx="176" cy="180" r="26" fill="#00B8A9"/>
    <circle cx="176" cy="180" r="26" fill="none" stroke="#102A43" stroke-width="4"/>
    <path d="M176 154 C166 168 166 192 176 206 M176 154 C186 168 186 192 176 206 M150 180 H202"
